<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M1 – Panorama strumenti IA | Slide interattive</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1A3560;--teal:#0D7C8F;--amber:#E8820C;--light:#EAF3F7;--gray:#F4F6F8;--white:#ffffff;--dark:#1E1E1E;--mid:#4A5568;--cap:#718096}
html,body{height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;background:#0f1e35}
.deck{width:100%;height:100vh;position:relative}
.slide{position:absolute;inset:0;display:none;flex-direction:column;opacity:0;transition:opacity .35s}
.slide.active{display:flex;opacity:1}
/* Nav */
.nav-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(26,53,96,.92);backdrop-filter:blur(8px);display:flex;align-items:center;padding:.5rem 1.5rem;gap:1rem;z-index:100;height:48px}
.nav-btn{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;padding:.3rem .9rem;border-radius:6px;cursor:pointer;font-size:.82rem;transition:all .15s}
.nav-btn:hover{background:rgba(255,255,255,.15)}
.nav-btn:disabled{opacity:.3;cursor:default}
.slide-counter{color:rgba(255,255,255,.6);font-size:.82rem;margin:0 auto}
.progress-dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:300px}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.2);transition:background .2s;cursor:pointer}
.dot.done{background:rgba(255,255,255,.5)}
.dot.current{background:var(--amber);transform:scale(1.3)}
/* SLIDE TYPES */
.s-cover{background:var(--navy);display:flex;flex-direction:row}
.s-cover .left-panel{width:32%;background:var(--teal);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem}
.s-cover .left-panel .icon{font-size:5rem;margin-bottom:1rem}
.s-cover .right-panel{flex:1;padding:2.5rem 3rem;display:flex;flex-direction:column;justify-content:center}
.s-cover .mod-badge{display:inline-block;background:var(--amber);color:#fff;font-size:.75rem;font-weight:700;padding:.3rem .9rem;border-radius:20px;letter-spacing:.08em;margin-bottom:1rem;align-self:flex-start}
.s-cover h1{font-size:2.2rem;font-weight:700;color:#fff;line-height:1.2;margin-bottom:1.5rem}
.s-cover .meta{font-size:.9rem;color:#A0C4D8;line-height:1.8}
.s-content{background:var(--white);padding:0 0 48px}
.s-content .top-bar{height:6px;background:var(--navy)}
.s-content .accent-bar{width:5px;position:fixed;left:0;top:6px;bottom:48px;background:var(--amber)}
.s-content .inner{padding:1.5rem 2rem 1rem 2.5rem;flex:1;overflow-y:auto}
.s-content h2{font-size:1.5rem;font-weight:700;color:var(--navy);margin-bottom:.25rem}
.s-content .subtitle{font-size:.9rem;color:var(--teal);font-style:italic;margin-bottom:1.25rem}
.s-dark{background:var(--navy);padding:0 0 48px}
.s-dark .top-bar{height:4px;background:var(--teal)}
.s-dark .bot-bar{position:fixed;bottom:48px;left:0;right:0;height:4px;background:var(--amber)}
.s-dark .inner{padding:1.5rem 2rem;flex:1;overflow-y:auto;color:#fff}
.s-dark h2{font-size:1.4rem;font-weight:700;color:#fff;margin-bottom:.25rem}
.s-dark .subtitle{font-size:.9rem;color:var(--teal);font-style:italic;margin-bottom:1.25rem}
/* Components */
.info-box{background:var(--light);border-left:4px solid var(--teal);padding:.85rem 1rem;border-radius:0 8px 8px 0;margin:.75rem 0;font-size:.88rem;color:var(--dark);line-height:1.5}
.info-box strong{color:var(--navy)}
.warn-box{background:#FFF3E0;border-left:4px solid var(--amber);padding:.85rem 1rem;border-radius:0 8px 8px 0;margin:.75rem 0;font-size:.88rem;color:#7A4000;line-height:1.5}
.card-grid{display:grid;gap:.75rem;margin:.75rem 0}
.card-grid.cols-2{grid-template-columns:1fr 1fr}
.card-grid.cols-3{grid-template-columns:1fr 1fr 1fr}
.card-grid.cols-4{grid-template-columns:1fr 1fr 1fr 1fr}
.card{background:#fff;border:1px solid #DDE3EA;border-radius:8px;padding:.85rem;position:relative;overflow:hidden}
.card .card-accent{position:absolute;left:0;top:0;bottom:0;width:4px}
.card .card-num{font-size:1.3rem;font-weight:700;color:var(--navy);margin-bottom:.25rem}
.card h4{font-size:.88rem;font-weight:700;color:var(--navy);margin-bottom:.35rem}
.card p,.card li{font-size:.82rem;color:var(--mid);line-height:1.45}
.level-col{background:var(--gray);border-radius:8px;overflow:hidden;flex:1}
.level-col .level-hdr{padding:.65rem .85rem;font-size:.82rem;font-weight:700;color:#fff}
.level-col .level-body{padding:.75rem .85rem}
.level-col .level-body li{font-size:.8rem;color:var(--dark);margin-bottom:.35rem;padding-left:1rem;position:relative}
.level-col .level-body li:before{content:"›";position:absolute;left:0;color:var(--teal);font-weight:700}
.level-col .level-note{padding:.6rem .85rem;background:rgba(0,0,0,.05);font-size:.75rem;color:var(--mid);font-style:italic;line-height:1.4}
.levels-row{display:flex;gap:.75rem;margin:.75rem 0}
table.compare{width:100%;border-collapse:collapse;font-size:.82rem;margin:.75rem 0}
table.compare th{background:var(--navy);color:#fff;padding:.5rem .65rem;text-align:left;font-weight:600}
table.compare td{padding:.45rem .65rem;border-bottom:1px solid #EEF2F7;vertical-align:top}
table.compare tr:nth-child(even) td{background:var(--gray)}
table.compare .tag-yes{color:#2E7D32;font-weight:600}
table.compare .tag-no{color:#C62828;font-weight:600}
table.compare .tag-caut{color:var(--amber);font-weight:600}
ul.plain-list{margin:.5rem 0;padding-left:1.2rem}
ul.plain-list li{font-size:.88rem;color:var(--dark);margin-bottom:.4rem;line-height:1.45}
ul.plain-list li span.label{font-weight:700;color:var(--navy)}
.step-box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:1rem;margin-bottom:.65rem}
.step-box .step-num{font-size:1.1rem;font-weight:700;color:var(--amber);margin-bottom:.2rem}
.step-box h4{font-size:.9rem;font-weight:700;color:#fff;margin-bottom:.3rem}
.step-box p{font-size:.82rem;color:#A0C4D8;line-height:1.4}
.takeaway-item{display:flex;align-items:flex-start;gap:.85rem;background:rgba(255,255,255,.06);border-radius:8px;padding:.85rem;margin-bottom:.6rem}
.takeaway-item .ti-icon{font-size:1.5rem;color:var(--amber);min-width:28px;margin-top:.1rem}
.takeaway-item .ti-title{font-size:.92rem;font-weight:700;color:var(--amber);margin-bottom:.2rem}
.takeaway-item .ti-text{font-size:.82rem;color:#A0C4D8;line-height:1.4}
.criteria-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.65rem;margin:.75rem 0}
.criterion{background:#fff;border:1px solid #DDE3EA;border-radius:8px;padding:.75rem;text-align:center}
.criterion .c-num{width:32px;height:32px;border-radius:50%;background:var(--teal);color:#fff;font-size:.9rem;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto .4rem}
.criterion h4{font-size:.82rem;font-weight:700;color:var(--navy);margin-bottom:.3rem}
.criterion p{font-size:.76rem;color:var(--mid);line-height:1.35}
.faq-row{display:flex;gap:0;border-bottom:1px solid #EEF2F7;padding:.65rem 0}
.faq-q{width:42%;font-size:.85rem;font-weight:600;color:var(--navy);padding-right:.75rem;line-height:1.4}
.faq-q span{color:var(--teal)}
.faq-a{flex:1;font-size:.82rem;color:var(--mid);line-height:1.4}
.faq-a span{color:var(--amber);font-weight:700}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="nav-bar">
  <button class="nav-btn" id="prevBtn" onclick="go(-1)">← Indietro</button>
  <div class="slide-counter" id="counter">1 / 20</div>
  <div class="progress-dots" id="dots"></div>
  <button class="nav-btn" id="nextBtn" onclick="go(1)">Avanti →</button>
</div>
<script>
const slides = [
  // 1 - Cover
  `<div class="slide s-cover">
    <div class="left-panel"><div class="icon">🎓</div></div>
    <div class="right-panel">
      <span class="mod-badge">MODULO 1</span>
      <h1>Panorama degli strumenti di Intelligenza Artificiale per l'educazione</h1>
      <div class="meta">
        Corso: Formare i formatori sull'IA nella scuola<br>
        Durata modulo: 4 ore &nbsp;|&nbsp; Impianto: Train the Trainers<br>
        Istituto Comprensivo – A.S. 2025/2026
      </div>
    </div>
  </div>`,

  // 2 - Obiettivi
  `<div class="slide s-content">
    <div class="top-bar"></div><div class="accent-bar"></div>
    <div class="inner">
      <h2>Obiettivi e struttura del modulo</h2>
      <div class="subtitle">Cosa impareremo e come è organizzato M1</div>
      <div class="info-box"><strong>Obiettivo formativo:</strong> orientare i futuri formatori nella comprensione delle principali categorie di strumenti IA e dei criteri di scelta responsabile nel contesto dell'istituto comprensivo.</div>
      <div class="card-grid cols-4" style="margin-top:.85rem">
        <div class="card"><div class="card-accent" style="background:#1A3560"></div><div class="card-num">01</div><h4>Panorama strumenti</h4><p>Categorie, funzioni e differenze tra i principali strumenti IA per l'educazione</p></div>
        <div class="card"><div class="card-accent" style="background:#0D7C8F"></div><div class="card-num">02</div><h4>Tre livelli d'uso</h4><p>Uso docente, uso mediato, uso diretto: distinzioni operative per la scuola</p></div>
        <div class="card"><div class="card-accent" style="background:#5B4A8A"></div><div class="card-num">03</div><h4>Criteri di scelta</h4><p>Come selezionare uno strumento: dati, età, privacy, limiti, controllo umano</p></div>
        <div class="card"><div class="card-accent" style="background:#E8820C"></div><div class="card-num">04</div><h4>Focus Trainer</h4><p>Come spiegare ai colleghi differenze, funzioni e criteri in modo efficace</p></div>
      </div>
      <div style="background:var(--amber);border-radius:6px;padding:.6rem 1rem;margin-top:.85rem;font-size:.85rem;font-weight:600;color:#fff">🔬 Laboratorio: Costruzione della mappa comparativa degli strumenti IA per l'educazione</div>
    </div>
  </div>`,

  // 3 - Perché l'IA nella scuola
  `<div class="slide s-content">
    <div class="top-bar"></div><div class="accent-bar"></div>
    <div class="inner">
      <h2>Perché parlare di IA nella scuola oggi?</h2>
      <div class="subtitle">Contesto, obbligo normativo e opportunità educativa</div>
      <div class="card-grid cols-1" style="gap:.65rem">
        <div class="card" style="border-left:4px solid #2B5EA7;padding:.85rem 1rem"><div style="display:flex;gap:.75rem;align-items:flex-start"><div style="font-size:1.4rem">🤖</div><div><h4 style="color:#2B5EA7;margin-bottom:.3rem">L'IA è già presente</h4><p>Strumenti IA sono già utilizzati da docenti, studenti e famiglie, spesso senza consapevolezza delle implicazioni didattiche e normative.</p></div></div></div>
        <div class="card" style="border-left:4px solid var(--navy);padding:.85rem 1rem"><div style="display:flex;gap:.75rem;align-items:flex-start"><div style="font-size:1.4rem">⚖️</div><div><h4 style="color:var(--navy);margin-bottom:.3rem">Un obbligo normativo</h4><p>L'art. 4 dell'AI Act (Reg. UE 2024/1689) introduce l'obbligo di AI literacy per chi utilizza sistemi IA in contesti organizzativi. La scuola non è esclusa.</p></div></div></div>
        <div class="card" style="border-left:4px solid var(--amber);padding:.85rem 1rem"><div style="display:flex;gap:.75rem;align-items:flex-start"><div style="font-size:1.4rem">💡</div><div><h4 style="color:var(--amber);margin-bottom:.3rem">Un'opportunità professionale</h4><p>I docenti formati possono guidare l'adozione consapevole dell'IA, integrando strumenti nel curricolo in modo coerente e responsabile.</p></div></div></div>
      </div>
      <div class="info-box" style="margin-top:.65rem">Il corso forma figure di sistema che sapranno guidare i colleghi: non usi improvvisati, ma adozione <strong>consapevole e responsabile</strong>.</div>
    </div>
  </div>`,

  // 4 - Quadro normativo
  `<div class="slide s-content">
    <div class="top-bar"></div><div class="accent-bar"></div>
    <div class="inner">
      <h2>Il quadro normativo essenziale</h2>
      <div class="subtitle">Tre livelli: europeo, nazionale, istituzionale</div>
      <div class="card-grid cols-2" style="gap:.65rem">
        <div class="card"><div class="card-accent" style="background:#2B5EA7"></div><div style="font-size:.7rem;font-weight:700;color:#2B5EA7;letter-spacing:.06em;margin-bottom:.3rem">UNIONE EUROPEA</div><h4>AI Act – Reg. UE 2024/1689</h4><p>Art. 4: obbligo di AI literacy per deployer. La scuola che usa sistemi IA è un deployer e deve formare il personale.</p></div>
        <div class="card"><div class="card-accent" style="background:var(--navy)"></div><div style="font-size:.7rem;font-weight:700;color:var(--navy);letter-spacing:.06em;margin-bottom:.3rem">ITALIA</div><h4>D.M. 166/2025 – Linee guida MIM</h4><p>Riferimento nazionale per l'adozione dell'IA nelle scuole: criteri di scelta, cautele d'uso, governance, formazione.</p></div>
        <div class="card"><div class="card-accent" style="background:var(--teal)"></div><div style="font-size:.7rem;font-weight:700;color:var(--teal);letter-spacing:.06em;margin-bottom:.3rem">UNIONE EUROPEA</div><h4>GDPR – Reg. UE 2016/679</h4><p>Regola il trattamento dei dati personali. Critico per l'uso di piattaforme IA: dati alunni, account, caricamento documenti.</p></div>
        <div class="card"><div class="card-accent" style="background:#5B4A8A"></div><div style="font-size:.7rem;font-weight:700;color:#5B4A8A;letter-spacing:.06em;margin-bottom:.3rem">INTERNAZIONALE</div><h4>UNESCO AI Competency Framework for Teachers</h4><p>Framework per la formazione docenti: mindset human-centred, etica, fondamenti IA, pedagogia, sviluppo professionale.</p></div>
      </div>
    </div>
  </div>`,

  // 5 - Deployer
  `<div class="slide s-content">
    <div class="top-bar"></div><div class="accent-bar"></div>
    <div class="inner">
      <h2>La scuola come deployer: cosa significa?</h2>
      <div class="subtitle">Una distinzione fondamentale dell'AI Act (art. 3)</div>
      <div class="info-box"><strong>Deployer (art. 3 AI Act):</strong> qualsiasi persona fisica o giuridica, autorità pubblica, agenzia o altro organismo che utilizza un sistema di IA sotto la propria responsabilità.</div>
      <div class="card-grid cols-3" style="margin-top:.75rem">
        <div class="card"><div class="card-accent" style="background:var(--teal)"></div><h4 style="color:var(--teal)">Quando la scuola è deployer</h4><ul class="plain-list" style="padding-left:.9rem;margin-top:.3rem"><li>Usa ChatGPT per preparare materiali</li><li>Adotta una piattaforma IA per la valutazione</li><li>Integra strumenti adattivi nella didattica</li></ul></div>
        <div class="card"><div class="card-accent" style="background:var(--navy)"></div><h4 style="color:var(--navy)">Cosa comporta</h4><ul class="plain-list" style="padding-left:.9rem;margin-top:.3rem"><li>Garantire AI literacy al personale (art. 4)</li><li>Valutare i rischi degli strumenti adottati</li><li>Rispettare il GDPR nel trattamento dati</li><li>Definire policy d'istituto sull'IA</li></ul></div>
        <div class="card"><div class="card-accent" style="background:var(--amber)"></div><h4 style="color:var(--amber)">Cosa NON significa</h4><ul class="plain-list" style="padding-left:.9rem;margin-top:.3rem"><li>Vietare ogni uso dell'IA nella scuola</li><li>Rispondere degli errori dei sistemi IA in sé</li><li>Formare tutti i docenti allo stesso livello</li></ul></div>
      </div>
    </div>
  </div>`,

  // 6 - Mappa categorie
  `<div class="slide s-content">
    <div class="top-bar"></div><div class="accent-bar"></div>
    <div class="inner">
      <h2>Le sei categorie di strumenti IA per l'educazione</h2>
      <div class="subtitle">Una mappa di orientamento: funzione, esempi, uso didattico</div>
      <div class="card-grid cols-3" style="gap:.6rem;margin-top:.5rem">
        <div class="card"><div class="card-accent" style="background:#2B5EA7"></div><div style="font-size:.65rem;font-weight:700;color:#2B5EA7;letter-spacing:.06em">CATEGORIA 1</div><h4>Chatbot e assistenti IA</h4><p>ChatGPT, Gemini, Copilot</p></div>
        <div class="card"><div class="card-accent" style="background:var(--teal)"></div><div style="font-size:.65rem;font-weight:700;color:var(--teal);letter-spacing:.06em">CATEGORIA 2</div><h4>Generatori di contenuti</h4><p>Canva Education, NotebookLM</p></div>
        <div class="card"><div class="card-accent" style="background:#5B4A8A"></div><div style="font-size:.65rem;font-weight:700;color:#5B4A8A;letter-spacing:.06em">CATEGORIA 3</div><h4>Tutor intelligenti</h4><p>Khanmigo (Khan Academy), Duolingo Max</p></div>
        <div class="card"><div class="card-accent" style="background:#2E7D32"></div><div style="font-size:.65rem;font-weight:700;color:#2E7D32;letter-spacing:.06em">CATEGORIA 4</div><h4>Strumenti adattivi</h4><p>DreamBox, Century Tech</p></div>
        <div class="card"><div class="card-accent" style="background:var(--amber)"></div><div style="font-size:.65rem;font-weight:700;color:var(--amber);letter-spacing:.06em">CATEGORIA 5</div><h4>Quiz e valutazione formativa</h4><p>Quizizz, Wayground, Socrative</p></div>
        <div class="card"><div class="card-accent" style="background:#B0003A"></div><div style="font-size:.65rem;font-weight:700;color:#B0003A;letter-spacing:.06em">CATEGORIA 6</div><h4>Strumenti per accessibilità</h4><p>Immersive Reader, Speechify</p></div>
      </div>
    </div>
  </div>`,

  // 7 - ChatGPT Gemini Copilot
  `<div class="slide s-content">
    <div class="top-bar"></div><div class="accent-bar"></div>
    <div class="inner">
      <h2>Chatbot IA: ChatGPT, Gemini, Copilot</h2>
      <div class="subtitle">La categoria più diffusa: come si distinguono per la scuola?</div>
      <table class="compare">
        <tr><th style="width:18%">Strumento</th><th>Punti di forza</th><th>Limitazioni</th><th style="width:30%">Per la scuola</th></tr>
        <tr><td><strong style="color:#10A37F">ChatGPT</strong><br><span style="font-size:.75rem;color:var(--mid)">OpenAI</span></td><td>Ottima qualità testuale, GPT-4o multimodale, ampia versatilità</td><td>Dati a OpenAI, età min. 13 anni, versione gratuita limitata</td><td>Uso docente: eccellente. Uso alunni &lt;13: <span class="tag-no">vietato</span></td></tr>
        <tr><td><strong style="color:#4285F4">Gemini</strong><br><span style="font-size:.75rem;color:var(--mid)">Google</span></td><td>Integrato con Google Workspace for Education, multimodale</td><td>Dati a Google, policy account minori da verificare</td><td>Workspace Education ha protezioni: <span class="tag-caut">verificare config.</span></td></tr>
        <tr><td><strong style="color:#0078D4">Copilot</strong><br><span style="font-size:.75rem;color:var(--mid)">Microsoft</span></td><td>Integrato in M365 Education: Word, PowerPoint, Teams</td><td>Funzioni avanzate richiedono licenza M365</td><td>Copilot for Education con modalità sicura: <span class="tag-caut">configurare</span></td></tr>
      </table>
      <div class="warn-box"><strong>⚠ Regola generale:</strong> Per i chatbot generativi, preferire l'uso docente (Livello 1) o mediato (Livello 2). L'uso diretto da parte degli alunni del primo ciclo è quasi sempre inappropriato.</div>
    </div>
  </div>`,

  // 8 - NotebookLM Canva
  `<div class="slide s-content">
    <div class="top-bar"></div><div class="accent-bar"></div>
    <div class="inner">
      <h2>Generatori di contenuti: NotebookLM e Canva Education</h2>
      <div class="subtitle">Funzioni e possibilità didattiche a confronto</div>
      <div class="card-grid cols-2" style="gap:.75rem;margin-top:.5rem">
        <div style="border:1px solid #DDE3EA;border-radius:8px;overflow:hidden">
          <div style="background:#1A73E8;padding:.6rem 1rem;font-size:.9rem;font-weight:700;color:#fff">NotebookLM (Google)</div>
          <div style="padding:.85rem">
            <p style="font-size:.82rem;font-weight:700;color:var(--navy);margin-bottom:.2rem">Cosa fa:</p><p style="font-size:.82rem;color:var(--mid);margin-bottom:.6rem">Analizza documenti caricati (PDF, testi, URL) e genera riepiloghi, domande, audio-podcast basandosi esclusivamente su quelle fonti.</p>
            <p style="font-size:.82rem;font-weight:700;color:var(--navy);margin-bottom:.2rem">Punto di forza:</p><p style="font-size:.82rem;color:var(--mid);margin-bottom:.6rem">Risponde solo in base ai documenti caricati → meno allucinazioni. Cita le fonti.</p>
            <p style="font-size:.82rem;font-weight:700;color:var(--navy);margin-bottom:.2rem">Limitazione critica:</p><p style="font-size:.82rem;color:var(--mid);margin-bottom:.6rem">Età minima de facto 18 anni. <strong style="color:#C62828">Solo uso docente.</strong></p>
            <div class="warn-box" style="margin-top:0;font-size:.79rem">Non caricare documenti con dati personali degli alunni.</div>
          </div>
        </div>
        <div style="border:1px solid #DDE3EA;border-radius:8px;overflow:hidden">
          <div style="background:#7D2AE8;padding:.6rem 1rem;font-size:.9rem;font-weight:700;color:#fff">Canva Education</div>

let cur = 0;
const deck = document.getElementById('deck');
const dotsEl = document.getElementById('dots');

// Build slides
slides.forEach((html,i)=>{
  const div = document.createElement('div');
  div.innerHTML = html;
  const sl = div.firstElementChild;
  deck.appendChild(sl);
});

// Build dots
slides.forEach((_,i)=>{
  const d = document.createElement('div');
  d.className='dot'+(i===0?' current':'');
  d.onclick=()=>goTo(i);
  dotsEl.appendChild(d);
});

function goTo(n){
  const sls = deck.querySelectorAll('.slide');
  const dts = dotsEl.querySelectorAll('.dot');
  sls[cur].classList.remove('active');
  dts[cur].classList.remove('current');
  dts[cur].classList.add('done');
  cur=n;
  sls[cur].classList.add('active');
  dts[cur].classList.remove('done');
  dts[cur].classList.add('current');
  document.getElementById('counter').textContent=(cur+1)+' / '+slides.length;
  document.getElementById('prevBtn').disabled=cur===0;
  document.getElementById('nextBtn').disabled=cur===slides.length-1;
}

function go(d){if(cur+d>=0&&cur+d<slides.length)goTo(cur+d);}

goTo(0);

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ')go(1);
  if(e.key==='ArrowLeft')go(-1);
});
</script>
