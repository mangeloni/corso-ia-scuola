<html lang="it">
<head>
<meta charset="UTF-8">

<title>M4 – Limiti, rischi, AI Act e uso responsabile | Slide interattive</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1A3560;--teal:#0D7C8F;--amber:#E8820C;--light:#EAF3F7;--gray:#F4F6F8;--white:#fff;--dark:#1E1E1E;--mid:#4A5568;--red:#C62828;--green:#2E7D32;--purple:#5B4A8A}
html,body{height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;background:#0f1e35}
.deck{width:100%;height:100vh;position:relative}
.slide{position:absolute;inset:0;display:none;flex-direction:column;opacity:0;transition:opacity .3s}
.slide.active{display:flex;opacity:1}
/* Nav */
.nav-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(26,53,96,.93);backdrop-filter:blur(8px);display:flex;align-items:center;padding:.5rem 1.5rem;gap:1rem;z-index:100;height:48px}
.nav-btn{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;padding:.3rem .9rem;border-radius:6px;cursor:pointer;font-size:.82rem;transition:all .15s}
.nav-btn:hover{background:rgba(255,255,255,.15)}
.nav-btn:disabled{opacity:.3;cursor:default}
.slide-counter{color:rgba(255,255,255,.6);font-size:.82rem;margin:0 auto}
.progress-dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:300px}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.2);transition:background .2s;cursor:pointer}
.dot.done{background:rgba(255,255,255,.5)}
.dot.current{background:var(--amber);transform:scale(1.3)}
/* Slide types */
.s-cover{background:var(--navy);display:flex;flex-direction:row}
.s-cover .l{width:32%;background:var(--teal);display:flex;align-items:center;justify-content:center;padding:2rem;font-size:5rem}
.s-cover .r{flex:1;padding:2.5rem 3rem;display:flex;flex-direction:column;justify-content:center}
.s-cover .badge{display:inline-block;background:var(--amber);color:#fff;font-size:.75rem;font-weight:700;padding:.3rem .9rem;border-radius:20px;letter-spacing:.08em;margin-bottom:1rem;align-self:flex-start}
.s-cover h1{font-size:2.15rem;font-weight:700;color:#fff;line-height:1.2;margin-bottom:1.5rem}
.s-cover .meta{font-size:.9rem;color:#A0C4D8;line-height:1.8}
.s-content{background:var(--white);padding:0 0 48px;display:flex;flex-direction:column}
.s-content .bar-top{height:6px;background:var(--navy)}
.s-content .bar-left{width:5px;position:fixed;left:0;top:6px;bottom:48px;background:var(--amber)}
.s-content .inner{padding:1.4rem 2rem 1rem 2.5rem;flex:1;overflow-y:auto}
.s-content h2{font-size:1.5rem;font-weight:700;color:var(--navy);margin-bottom:.22rem}
.s-content .sub{font-size:.9rem;color:var(--teal);font-style:italic;margin-bottom:1rem}
.s-dark{background:var(--navy);padding:0 0 48px;display:flex;flex-direction:column}
.s-dark .bar-top{height:4px;background:var(--teal)}
.s-dark .bar-bot{position:fixed;bottom:48px;left:0;right:0;height:4px;background:var(--amber)}
.s-dark .inner{padding:1.5rem 2rem;flex:1;overflow-y:auto}
.s-dark h2{font-size:1.4rem;font-weight:700;color:#fff;margin-bottom:.25rem}
/* Components */
.info{background:var(--light);border-left:4px solid var(--teal);padding:.78rem 1rem;border-radius:0 8px 8px 0;margin:.65rem 0;font-size:.87rem;color:var(--dark);line-height:1.5}
.info strong{color:var(--navy)}
.warn{background:#FFF3E0;border-left:4px solid var(--amber);padding:.78rem 1rem;border-radius:0 8px 8px 0;margin:.65rem 0;font-size:.87rem;color:#7A4000;line-height:1.5}
.grid{display:grid;gap:.65rem;margin:.65rem 0}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
.g4{grid-template-columns:1fr 1fr 1fr 1fr}
.card{background:#fff;border:1px solid #DDE3EA;border-radius:8px;padding:.8rem;position:relative;overflow:hidden}
.card .acc{position:absolute;left:0;top:0;bottom:0;width:4px}
.card h4{font-size:.87rem;font-weight:700;color:var(--navy);margin-bottom:.3rem}
.card p,.card li{font-size:.81rem;color:var(--mid);line-height:1.45}
.card ul{padding-left:1.1rem;margin-top:.3rem}
tbl{width:100%;border-collapse:collapse;font-size:.81rem;margin:.65rem 0}
table.tbl{width:100%;border-collapse:collapse;font-size:.81rem;margin:.65rem 0}
table.tbl th{background:var(--navy);color:#fff;padding:.45rem .6rem;text-align:left;font-weight:600}
table.tbl td{padding:.42rem .6rem;border-bottom:1px solid #EEF2F7;vertical-align:top;line-height:1.4}
table.tbl tr:nth-child(even) td{background:var(--gray)}
.tbl-risk td:nth-child(3){font-weight:700}
.risk-min{color:var(--green)}
.risk-lim{color:var(--amber)}
.risk-alt{color:var(--red)}
.risk-viet{color:#B71C1C}
ul.pl{margin:.4rem 0;padding-left:1.2rem}
ul.pl li{font-size:.84rem;color:var(--dark);margin-bottom:.36rem;line-height:1.45}
/* Timeline */
.timeline{display:flex;flex-direction:column;gap:.5rem;margin:.65rem 0}
.tl-row{display:flex;gap:.85rem;align-items:flex-start}
.tl-date{min-width:130px;font-weight:700;font-size:.9rem;color:var(--amber);padding-top:.1rem}
.tl-bar{width:4px;min-height:100%;background:var(--teal);border-radius:2px;margin-top:.3rem;position:relative}
.tl-bar::before{content:'';position:absolute;top:0;left:-4px;width:12px;height:12px;border-radius:50%;background:var(--teal)}
.tl-content h4{font-size:.9rem;font-weight:700;color:var(--navy);margin-bottom:.15rem}
.tl-content p{font-size:.82rem;color:var(--mid);line-height:1.4}
.tl-content .tag{display:inline-block;background:var(--light);color:var(--teal);font-size:.72rem;font-weight:600;padding:.1rem .45rem;border-radius:10px;margin-top:.2rem}
/* Risk boxes */
.risk-box{border-radius:8px;overflow:hidden;margin-bottom:.55rem}
.risk-hdr{padding:.4rem .9rem;font-size:.8rem;font-weight:700;letter-spacing:.04em;color:#fff}
.risk-body{padding:.55rem .9rem;font-size:.81rem;line-height:1.5}
.risk-body li{margin-bottom:.2rem}
/* Checklist */
.ck-section{border:1px solid #DDE3EA;border-radius:8px;overflow:hidden;margin:.5rem 0}
.ck-hdr{padding:.42rem .85rem;font-size:.85rem;font-weight:700;color:#fff}
.ck-row{display:flex;gap:.6rem;padding:.38rem .85rem;border-bottom:1px solid #EEF2F7;font-size:.82rem;align-items:flex-start}
.ck-row:last-child{border-bottom:none}
.ck-row:nth-child(even){background:var(--gray)}
.ck-box{color:var(--teal);min-width:16px}
/* Steps (dark) */
.step-box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:.9rem;margin-bottom:.6rem}
.step-num{font-size:1.05rem;font-weight:700;color:var(--amber);margin-bottom:.15rem}
.step-box h4{font-size:.88rem;font-weight:700;color:#fff;margin-bottom:.25rem}
.step-box p{font-size:.81rem;color:#A0C4D8;line-height:1.4}
/* Takeaway */
.tkw{display:flex;align-items:flex-start;gap:.8rem;background:rgba(255,255,255,.06);border-radius:8px;padding:.8rem;margin-bottom:.55rem}
.tkw .icon{font-size:1.4rem;min-width:26px;margin-top:.05rem}
.tkw .title{font-size:.9rem;font-weight:700;color:var(--amber);margin-bottom:.15rem}
.tkw .desc{font-size:.8rem;color:#A0C4D8;line-height:1.4}
/* FAQ */
.faq-row{border-bottom:1px solid #EEF2F7;padding:.58rem 0}
.faq-row:last-child{border-bottom:none}
.faq-q{font-size:.87rem;font-weight:600;color:var(--navy);margin-bottom:.22rem}
.faq-a{font-size:.83rem;color:var(--mid);line-height:1.45}
</style>
</head>

// 4 Deployer
`<div class="slide s-content"><div class="bar-top"></div><div class="bar-left"></div><div class="inner">

  <div class="info"><strong>Come spiegarlo ai colleghi:</strong> far produrre all'IA descrizioni di ruoli professionali e analizzare insieme i risultati. È l'esercizio più efficace per creare consapevolezza — senza teoria.</div>

// 8 Allucinazioni
`<div class="slide s-content"><div class="bar-top"></div><div class="bar-left"></div><div class="inner">
  <h2>Allucinazioni: dal fenomeno alla strategia</h2>
  <div class="sub">Tipologie, cause strutturali e come trasformarle in didattica critica</div>
  <div class="info"><strong>Allucinazione:</strong> output IA che contiene informazioni false presentate con la stessa sicurezza di quelle vere. Non è un bug: è una caratteristica strutturale degli LLM, che predicono la parola più probabile senza verificare i fatti.</div>
  <table class="tbl">
    <tr><th style="width:48%">Tipologia (esempi documentati)</th><th>Come trasformarla in didattica critica</th></tr>
    <tr><td>Citazioni bibliografiche inventate: autore, titolo, rivista, DOI, anno — tutto falso</td><td>Chiedere all'IA 5 fonti su un argomento → verificarle su Google Scholar: esercizio potente e memorabile</td></tr>
    <tr><td>Date storiche errate o invertite</td><td>Usare le allucinazioni come spunto: «Cosa ci dice questo errore sul funzionamento dell'IA?»</td></tr>
    <tr><td>Leggi, norme e articoli di legge inesistenti o con numero sbagliato</td><td>Far cercare agli alunni l'errore nell'output: pensiero critico applicato</td></tr>
    <tr><td>Fatti scientifici presentati come consolidati ma non verificabili</td><td>Mostrare che l'IA sbaglia anche su contenuti di programma: motiva la verifica sistematica</td></tr>
    <tr><td>Dati statistici inventati con apparente precisione</td><td>Collegare al concetto di fonte attendibile e alfabetizzazione informativa</td></tr>
    <tr><td>Citazioni di personaggi reali che non le hanno mai pronunciate</td><td>Esercizio: «Chi ha detto questa frase?» → ricerca → l'IA l'ha inventata</td></tr>
  </table>
</div></div>`,

// 9 Copyright
`<div class="slide s-content"><div class="bar-top"></div><div class="bar-left"></div><div class="inner">
  <h2>Copyright e IA generativa</h2>
  <div class="sub">Una zona grigia che i formatori devono saper spiegare</div>
  <div class="faq-row">
    <div class="faq-q">D: Gli output dell'IA sono protetti da diritto d'autore?</div>
    <div class="faq-a">R: In Italia e in UE: <strong>generalmente no</strong>. Il diritto d'autore richiede un autore umano con attività creativa. Un output generato interamente dall'IA senza contributo creativo umano significativo non è protetto. (L. 633/1941; posizione in evoluzione.)</div>
  </div>
  <div class="faq-row">
    <div class="faq-q">D: L'IA può aver violato copyright nei dati di addestramento?</div>
    <div class="faq-a">R: Possibile. I modelli IA sono stati addestrati su miliardi di testi, spesso senza licenza esplicita. In UE si applica l'eccezione di <em>text and data mining</em> (Dir. 2019/790), con limiti. Il dibattito legale è aperto.</div>
  </div>
  <div class="faq-row">
    <div class="faq-q">D: Posso usare output IA per materiali didattici?</div>
    <div class="faq-a">R: <strong>Sì, con cautela:</strong> verificare che l'output non riproduca testualmente testi protetti. L'output IA può contenere frammenti di testi originali (problema di memorizzazione). Preferire rielaborazione critica a copia diretta.</div>
  </div>
  <div class="faq-row">
    <div class="faq-q">D: Devo dichiarare l'uso dell'IA?</div>
    <div class="faq-a">R: Come buona prassi professionale: <strong>sì, sempre</strong>. Come obbligo normativo: dal 2026 l'art. 50 AI Act richiederà etichettatura dei contenuti generati da IA. Alcune policy d'istituto già lo prevedono.</div>
  </div>
  <div class="faq-row" style="border-bottom:none">
    <div class="faq-q">D: Gli alunni possono usare IA per i compiti?</div>
    <div class="faq-a">R: Dipende dalla policy d'istituto e dalle indicazioni del docente. Non è un divieto di legge in senso stretto. È una questione di valutazione dell'apprendimento: <strong>il docente decide cosa valuta e come</strong>.</div>
  </div>
</div></div>`,

`<div class="slide s-content"><div class="bar-top"></div><div class="bar-left"></div><div class="inner">

    <div class="card" style="border-left:4px solid var(--teal)"><h4>4. Tieni un appiglio normativo concreto</h4><p>Non basta «è buona prassi». Citare art. 4 AI Act (già in vigore dal 2 febbraio 2025) e GDPR / 14 anni in Italia dà al formatore credibilità e non opinabilità.</p></div>

  <div class="tkw"><div class="icon">✓</div><div><div class="title">La checklist di conformità minima</div><div class="desc">Quarta componente del kit del formatore: strumento operativo pronto per accompagnare i colleghi nella scelta e nell'uso responsabile degli strumenti IA</div></div></div>
</div></div>`

];

const deck=document.getElementById('deck'), dotsEl=document.getElementById('dots');
let cur=0;
S.forEach(h=>{const d=document.createElement('div');d.innerHTML=h;deck.appendChild(d.firstElementChild);});
S.forEach((_,i)=>{const d=document.createElement('div');d.className='dot'+(i===0?' current':'');d.onclick=()=>goTo(i);dotsEl.appendChild(d);});
function goTo(n){
  const sls=deck.querySelectorAll('.slide'),dts=dotsEl.querySelectorAll('.dot');
  sls[cur].classList.remove('active');dts[cur].classList.remove('current');dts[cur].classList.add('done');
  cur=n;sls[cur].classList.add('active');dts[cur].classList.remove('done');dts[cur].classList.add('current');
  document.getElementById('counter').textContent=(cur+1)+' / '+S.length;
  document.getElementById('prevBtn').disabled=cur===0;
  document.getElementById('nextBtn').disabled=cur===S.length-1;
}
function go(d){if(cur+d>=0&&cur+d<S.length)goTo(cur+d);}
goTo(0);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1);});
</script>
