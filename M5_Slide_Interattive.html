<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M5 – Implementazione pratica e accompagnamento dei docenti | Slide interattive</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1A3560;--teal:#0D7C8F;--amber:#E8820C;--light:#EAF3F7;--gray:#F4F6F8;--white:#fff;--dark:#1E1E1E;--mid:#4A5568;--red:#C62828;--green:#2E7D32;--purple:#5B4A8A}
html,body{height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;background:#0f1e35}
.deck{width:100%;height:100vh;position:relative}
.slide{position:absolute;inset:0;display:none;flex-direction:column;opacity:0;transition:opacity .3s}
.slide.active{display:flex;opacity:1}
/* Nav */
.nav-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(26,53,96,.93);backdrop-filter:blur(8px);display:flex;align-items:center;padding:.5rem 1.5rem;gap:1rem;z-index:100;height:48px}
.nav-btn{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;padding:.3rem .9rem;border-radius:6px;cursor:pointer;font-size:.82rem;transition:all .15s}
.nav-btn:hover{background:rgba(255,255,255,.15)}
.nav-btn:disabled{opacity:.3;cursor:default}
.slide-counter{color:rgba(255,255,255,.6);font-size:.82rem;margin:0 auto}
.progress-dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:300px}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.2);transition:background .2s;cursor:pointer}
.dot.done{background:rgba(255,255,255,.5)}
.dot.current{background:var(--amber);transform:scale(1.3)}
/* Slide types */
.s-cover{background:var(--navy);display:flex;flex-direction:row}
.s-cover .l{width:32%;background:var(--teal);display:flex;align-items:center;justify-content:center;padding:2rem;font-size:5rem}
.s-cover .r{flex:1;padding:2.5rem 3rem;display:flex;flex-direction:column;justify-content:center}
.s-cover .badge{display:inline-block;background:var(--amber);color:#fff;font-size:.75rem;font-weight:700;padding:.3rem .9rem;border-radius:20px;letter-spacing:.08em;margin-bottom:1rem;align-self:flex-start}
.s-cover h1{font-size:2.15rem;font-weight:700;color:#fff;line-height:1.2;margin-bottom:1.5rem}
.s-cover .meta{font-size:.9rem;color:#A0C4D8;line-height:1.8}
.s-content{background:var(--white);padding:0 0 48px;display:flex;flex-direction:column}
.s-content .bar-top{height:6px;background:var(--navy)}
.s-content .bar-left{width:5px;position:fixed;left:0;top:6px;bottom:48px;background:var(--amber)}
.s-content .inner{padding:1.4rem 2rem 1rem 2.5rem;flex:1;overflow-y:auto}
.s-content h2{font-size:1.5rem;font-weight:700;color:var(--navy);margin-bottom:.22rem}
.s-content .sub{font-size:.9rem;color:var(--teal);font-style:italic;margin-bottom:1rem}
.s-dark{background:var(--navy);padding:0 0 48px;display:flex;flex-direction:column}
.s-dark .bar-top{height:4px;background:var(--teal)}
.s-dark .bar-bot{position:fixed;bottom:48px;left:0;right:0;height:4px;background:var(--amber)}
.s-dark .inner{padding:1.5rem 2rem;flex:1;overflow-y:auto}
.s-dark h2{font-size:1.4rem;font-weight:700;color:#fff;margin-bottom:.25rem}
/* Components */
.info{background:var(--light);border-left:4px solid var(--teal);padding:.78rem 1rem;border-radius:0 8px 8px 0;margin:.65rem 0;font-size:.87rem;color:var(--dark);line-height:1.5}
.info strong{color:var(--navy)}
.warn{background:#FFF3E0;border-left:4px solid var(--amber);padding:.78rem 1rem;border-radius:0 8px 8px 0;margin:.65rem 0;font-size:.87rem;color:#7A4000;line-height:1.5}
.grid{display:grid;gap:.65rem;margin:.65rem 0}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
.g4{grid-template-columns:1fr 1fr 1fr 1fr}
.card{background:#fff;border:1px solid #DDE3EA;border-radius:8px;padding:.8rem;position:relative;overflow:hidden}
.card .acc{position:absolute;left:0;top:0;bottom:0;width:4px}
.card h4{font-size:.87rem;font-weight:700;color:var(--navy);margin-bottom:.3rem}
.card p,.card li{font-size:.81rem;color:var(--mid);line-height:1.45}
.card ul{padding-left:1.1rem;margin-top:.3rem}
table.tbl{width:100%;border-collapse:collapse;font-size:.81rem;margin:.65rem 0}
table.tbl th{background:var(--navy);color:#fff;padding:.45rem .6rem;text-align:left;font-weight:600}
table.tbl td{padding:.42rem .6rem;border-bottom:1px solid #EEF2F7;vertical-align:top;line-height:1.4}
table.tbl tr:nth-child(even) td{background:var(--gray)}
ul.pl{margin:.4rem 0;padding-left:1.2rem}
ul.pl li{font-size:.84rem;color:var(--dark);margin-bottom:.36rem;line-height:1.45}
/* Checklist */
.ck-section{border:1px solid #DDE3EA;border-radius:8px;overflow:hidden;margin:.5rem 0}
.ck-hdr{padding:.42rem .85rem;font-size:.85rem;font-weight:700;color:#fff}
.ck-row{display:flex;gap:.6rem;padding:.38rem .85rem;border-bottom:1px solid #EEF2F7;font-size:.82rem;align-items:flex-start}
.ck-row:last-child{border-bottom:none}
.ck-row:nth-child(even){background:var(--gray)}
.ck-box{color:var(--teal);min-width:16px}
/* Steps (dark) */
.step-box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:.9rem;margin-bottom:.6rem}
.step-num{font-size:1.05rem;font-weight:700;color:var(--amber);margin-bottom:.15rem}
.step-box h4{font-size:.88rem;font-weight:700;color:#fff;margin-bottom:.25rem}
.step-box p{font-size:.81rem;color:#A0C4D8;line-height:1.4}
/* Takeaway */
.tkw{display:flex;align-items:flex-start;gap:.8rem;background:rgba(255,255,255,.06);border-radius:8px;padding:.8rem;margin-bottom:.55rem}
.tkw .icon{font-size:1.4rem;min-width:26px;margin-top:.05rem}
.tkw .title{font-size:.9rem;font-weight:700;color:var(--amber);margin-bottom:.15rem}
.tkw .desc{font-size:.8rem;color:#A0C4D8;line-height:1.4}
/* FAQ */
.faq-row{border-bottom:1px solid #EEF2F7;padding:.58rem 0}
.faq-row:last-child{border-bottom:none}
.faq-q{font-size:.87rem;font-weight:600;color:var(--navy);margin-bottom:.22rem}
.faq-a{font-size:.83rem;color:var(--mid);line-height:1.45}
/* Level cards */
.lvl-card{border-radius:8px;overflow:hidden;margin-bottom:.5rem}
.lvl-hdr{padding:.4rem .9rem;font-size:.82rem;font-weight:700;color:#fff;letter-spacing:.04em}
.lvl-body{padding:.55rem .9rem;font-size:.82rem;line-height:1.5;background:var(--gray)}
.lvl-body li{margin-bottom:.2rem}
</style>
</head>

<script>
const S = [

// 1 Cover
`<div class="slide s-cover">
  <div class="l">🤝</div>
  <div class="r">
    <div class="badge">MODULO 5 · 4 ORE</div>
    <h1>Implementazione pratica e accompagnamento dei docenti</h1>
    <div class="meta">
      Corso — Formare i formatori sull'Intelligenza Artificiale nella scuola<br>

// 2 Obiettivi e struttura
`<div class="slide s-content"><div class="bar-top"></div><div class="bar-left"></div><div class="inner">
  <h2>Obiettivi e struttura del modulo</h2>
  <div class="sub">Cosa saprete fare al termine delle 4 ore</div>
  <div class="grid g2">
    <div class="card"><div class="acc" style="background:var(--teal)"></div>
      <h4>🎯 Obiettivo principale</h4>
      <p>Progettare, organizzare e supervisionare attività di accompagnamento per i colleghi dell'istituto, sostenendo un'adozione responsabile e curricolarmente coerente dell'IA.</p>
    </div>
    <div class="card"><div class="acc" style="background:var(--amber)"></div>
      <h4>🔄 Il salto di ruolo</h4>
      <p>Passare dal <em>sapere usare</em> strumenti IA al <em>saper formare</em> altri docenti, supervisionare pratiche, definire criteri comuni nell'istituto.</p>
    </div>
  </div>
  <div class="info"><strong>Contenuti principali:</strong> strategie di accompagnamento · progettazione di interventi formativi · gestione delle resistenze · esempi per infanzia, primaria e secondaria di I grado · uso curricolarmente coerente · introduzione progressiva come vincolo progettuale</div>
  <table class="tbl">
    <thead><tr><th>Sequenza</th><th>Contenuto</th><th>Tempo</th></tr></thead>
    <tbody>
      <tr><td>1</td><td>Dal sapere usare al saper formare — il salto di competenza</td><td>30 min</td></tr>
      <tr><td>2</td><td>Strategie di accompagnamento e gestione delle resistenze</td><td>40 min</td></tr>
      <tr><td>3</td><td>Esempi pratici per i tre ordini del primo ciclo</td><td>30 min</td></tr>
      <tr><td>4</td><td>Progettazione della mini-unità formativa</td><td>30 min</td></tr>
      <tr><td>5</td><td>Laboratorio: costruzione del kit del formatore</td><td>70 min</td></tr>
    </tbody>

// 3 Il salto di competenza
`<div class="slide s-content"><div class="bar-top"></div><div class="bar-left"></div><div class="inner">
  <h2>Il salto: dal "sapere usare" al "saper formare"</h2>
  <div class="sub">La competenza TTT non si acquisisce usando l'IA — si acquisisce insegnando agli altri a usarla</div>
  <div class="grid g2" style="margin-bottom:.7rem">
    <div class="card"><div class="acc" style="background:var(--mid)"></div>
      <h4>🙋 Sapere usare (Livello 1)</h4>
      <ul>
        <li>Uso personale degli strumenti IA</li>
        <li>Capacità di produrre output per la propria classe</li>
        <li>Conoscenza dei criteri di scelta</li>
        <li>Consapevolezza dei limiti e dei rischi</li>
      </ul>
      <p style="margin-top:.5rem;font-style:italic;font-size:.79rem">→ Copre i moduli M1–M4 del corso</p>
    </div>
    <div class="card"><div class="acc" style="background:var(--teal)"></div>
      <h4>🏫 Saper formare (Livello 2 — TTT)</h4>
      <ul>
        <li>Spiegare a colleghi non esperti</li>
        <li>Guidare l'adozione responsabile nell'istituto</li>
        <li>Supervisionare pratiche e definire criteri comuni</li>
        <li>Sostenere chi resiste e chi si entusiasma acriticamente</li>
      </ul>
      <p style="margin-top:.5rem;font-style:italic;font-size:.79rem">→ Focus del modulo M5</p>
    </div>
  </div>

  <div class="info"><strong>Principio TTT:</strong> il formatore interno non è l'esperto di IA dell'istituto — è la persona che sa creare le condizioni perché i colleghi adottino l'IA in modo responsabile e sostenibile.</div>
</div></div>`,

// 4 Strategie di accompagnamento
`<div class="slide s-content"><div class="bar-top"></div><div class="bar-left"></div><div class="inner">
  <h2>Strategie di accompagnamento: il framework</h2>
  <div class="sub">Quattro approcci complementari per sostenere i colleghi</div>
  <div class="grid g2">
    <div class="card"><div class="acc" style="background:var(--teal)"></div>
      <h4>🔍 1. Modellamento</h4>
      <p>Il formatore usa lo strumento davanti ai colleghi, esplicitando ogni passaggio: "Sto facendo così perché… Noto questo problema… Verifico in questo modo…"</p>
      <p style="margin-top:.4rem;font-size:.79rem;color:var(--teal)">Efficace per: resistenti, dubbiosi, "non ho tempo di imparare"</p>
    </div>
    <div class="card"><div class="acc" style="background:var(--amber)"></div>
      <h4>🛠️ 2. Pratica guidata</h4>
      <p>I colleghi usano lo strumento con il formatore accanto: laboratorio hands-on, errori previsti e gestiti, riflessione sull'output. Non tutorial — esperienza.</p>
      <p style="margin-top:.4rem;font-size:.79rem;color:var(--amber)">Efficace per: chi "non sa da dove iniziare"</p>
    </div>
    <div class="card"><div class="acc" style="background:var(--purple)"></div>
      <h4>👥 3. Peer learning</h4>
      <p>Coppie o piccoli gruppi lavorano insieme su casi reali dell'istituto. Il formatore osserva e interviene solo quando necessario. La negoziazione tra pari accelera l'apprendimento.</p>
      <p style="margin-top:.4rem;font-size:.79rem;color:var(--purple)">Efficace per: gruppi già motivati, docenti esperti</p>
    </div>
    <div class="card"><div class="acc" style="background:var(--green)"></div>
      <h4>📋 4. Accompagnamento strutturato</h4>
      <p>Il formatore fornisce checklist, schede operative e criteri condivisi. I colleghi lavorano in autonomia e tornano con output da discutere. Sostiene la pratica nel tempo.</p>
      <p style="margin-top:.4rem;font-size:.79rem;color:var(--green)">Efficace per: dopo la prima formazione, per consolidare</p>
    </div>
  </div>
  <div class="info" style="margin-top:.5rem"><strong>Regola operativa:</strong> non scegliere una sola strategia. Combinarle in sequenza: modellamento → pratica guidata → peer learning → accompagnamento strutturato.</div>
</div></div>`,

// 5 Gestire le resistenze
`<div class="slide s-content"><div class="bar-top"></div><div class="bar-left"></div><div class="inner">
  <h2>Gestire le resistenze dei colleghi</h2>
  <div class="sub">Ogni posizione ha una logica — capirla è il primo passo per risponderle</div>
  <table class="tbl">
    <thead><tr><th>Posizione</th><th>Logica sottostante</th><th>Risposta formativa efficace</th></tr></thead>
    <tbody>
      <tr>
        <td><strong>"L'IA sostituirà i docenti"</strong></td>
        <td>Paura del ruolo, identità professionale minacciata</td>
        <td>Portare esempi in cui il controllo umano è insostituibile (valutazione, relazione, personalizzazione). L'IA esegue, il docente decide.</td>
      </tr>
      <tr>
        <td><strong>"Non ho tempo di imparare"</strong></td>
        <td>Carico di lavoro reale, saturazione formativa</td>
        <td>Partire da ciò che già fa: preparare verifiche, cercare fonti, semplificare testi. Mostrare un risparmio concreto di tempo.</td>
      </tr>
      <tr>
        <td><strong>"I ragazzi la useranno per copiare"</strong></td>
        <td>Preoccupazione valutativa legittima</td>
        <td>Riprogettare compiti con IA, non contro di essa. Valutare il processo, non solo il prodotto. Mostrare formati valutativi alternativi.</td>
      </tr>
      <tr>
        <td><strong>"Non è affidabile, inventa tutto"</strong></td>
        <td>Esperienza reale con allucinazioni</td>
        <td>Concordare: nessun output IA va usato senza revisione. Mostrare come verificare le fonti. Trasformare il limite in contenuto didattico.</td>
      </tr>
      <tr>
        <td><strong>"Funziona tutto benissimo!"</strong></td>
        <td>Entusiasmo acritico, rischio di usi impropri</td>
        <td>Rallentare: quali dati sta trattando? Chi ha autorizzato l'uso con gli alunni? Quali output ha controllato? Introdurre la checklist.</td>
      </tr>
    </tbody>
  </table>
  <div class="warn"><strong>⚠️ Principio TTT:</strong> non confutare, accompagnare. Chi resiste ha spesso ragione su qualcosa. Partire dalla ragione del collega, non dalla propria risposta pronta.</div>
</div></div>`,

// 6 Progettazione intervento formativo
`<div class="slide s-content"><div class="bar-top"></div><div class="bar-left"></div><div class="inner">
  <h2>Progettare un intervento formativo breve</h2>
  <div class="sub">La mini-sessione TTT: struttura in 6 elementi</div>
  <div class="grid g3">
    <div class="card"><div class="acc" style="background:var(--navy)"></div>
      <h4>1. Obiettivo</h4>
      <p>Un solo obiettivo, formulato in termini di <em>cosa sapranno fare</em> i colleghi al termine. Mai più di uno per sessione breve.</p>
    </div>
    <div class="card"><div class="acc" style="background:var(--teal)"></div>
      <h4>2. Destinatari</h4>
      <p>Chi sono? Quale ordine? Quale livello di familiarità con l'IA? Quale resistenza probabile? Adattare il registro di conseguenza.</p>
    </div>
    <div class="card"><div class="acc" style="background:var(--amber)"></div>
      <h4>3. Tempi</h4>
      <p>10–20 minuti per una micro-sessione. 60–90 minuti per un laboratorio. Non superare 2 ore senza un'attività pratica intermedia.</p>
    </div>
    <div class="card"><div class="acc" style="background:var(--purple)"></div>
      <h4>4. Materiali</h4>
      <p>Un solo strumento per sessione. Una scheda operativa stampabile. Esempi concreti del proprio ordine di scuola. Nessuna slide teorica senza pratica.</p>
    </div>
    <div class="card"><div class="acc" style="background:var(--green)"></div>
      <h4>5. Attività pratica</h4>
      <p>Minimo 50% del tempo dedicato a fare. I colleghi usano lo strumento su un caso reale del proprio contesto. Il formatore osserva e supporta.</p>
    </div>
    <div class="card"><div class="acc" style="background:var(--red)"></div>
      <h4>6. Verifica e cautele</h4>
      <p>Exit ticket con 2–3 domande. Reminder delle cautele (dati, età, controllo umano). Una indicazione operativa da portare in classe la settimana successiva.</p>
    </div>
  </div>
  <div class="info"><strong>Formato consigliato per il primo ciclo:</strong> 60 min — 10 min introduzione + 35 min pratica guidata + 10 min discussione output + 5 min exit ticket e cautele.</div>
</div></div>`,

// 7 Esempi scuola dell'infanzia
`<div class="slide s-content"><div class="bar-top"></div><div class="bar-left"></div><div class="inner">
  <h2>IA nella scuola dell'infanzia</h2>
  <div class="sub">Esempi pratici per accompagnare le colleghe — solo Livello 1 (uso docente) e Livello 2 (uso mediato)</div>

          <li>Generare idee per attività su un tema dell'anno (es. "acqua", "natura", "amicizia") con ChatGPT — verificare e adattare</li>

          <li>Creare schede illustrate descrittive con Canva Education (docente)</li>
          <li>Riepilogare documentazione pedagogica con NotebookLM (solo docente, &gt;18 anni)</li>
        </ul>

</div></div>`,

// 8 Esempi scuola primaria
`<div class="slide s-content"><div class="bar-top"></div><div class="bar-left"></div><div class="inner">
  <h2>IA nella scuola primaria</h2>
  <div class="sub">Esempi pratici — con attenzione all'età minima, agli account e al trattamento dei dati</div>
  <div class="info"><strong>Riferimento normativo:</strong> in Italia il consenso al trattamento dati per servizi digitali è <strong>14 anni</strong> (art. 2-quinquies D.Lgs. 101/2018). La maggior parte degli alunni della primaria non ha questa età. Il Livello 3 richiede autorizzazione del DS, DPA e consenso dei genitori.</div>
  <table class="tbl" style="margin-top:.5rem">
    <thead><tr><th>Livello</th><th>Esempi primaria</th><th>Condizione</th></tr></thead>
    <tbody>
      <tr>
        <td><strong>L1 — Docente</strong></td>
        <td>Generare domande di comprensione su un testo letto in classe · Semplificare spiegazioni per BES · Creare rubriche di valutazione · Produrre esercizi differenziati</td>
        <td>Sempre possibile. Non inviare dati degli alunni.</td>
      </tr>
      <tr>
        <td><strong>L2 — Mediato</strong></td>
        <td>LIM: chiedere alla classe quale prompt dare all'IA per scrivere il finale di una storia · Analizzare collettivamente un output: "è corretto? cosa manca?" · Quizizz proiettato in plenaria senza account alunni</td>
        <td>Nessun account alunni, nessun dato personale inviato.</td>
      </tr>
      <tr>
        <td><strong>L3 — Diretto</strong></td>
        <td>Canva Education con account istituzionale (classi IV–V) · Quizizz con account studenti (classi IV–V)</td>
        <td>Solo con delibera DS + DPA firmato + consenso genitori. Verificare età minima dello strumento.</td>
      </tr>

const deck=document.getElementById('deck'), dotsEl=document.getElementById('dots');
let cur=0;
S.forEach(h=>{const d=document.createElement('div');d.innerHTML=h;deck.appendChild(d.firstElementChild);});
S.forEach((_,i)=>{const d=document.createElement('div');d.className='dot'+(i===0?' current':'');d.onclick=()=>goTo(i);dotsEl.appendChild(d);});
function goTo(n){
  const sls=deck.querySelectorAll('.slide'),dts=dotsEl.querySelectorAll('.dot');
  sls[cur].classList.remove('active');dts[cur].classList.remove('current');dts[cur].classList.add('done');
  cur=n;sls[cur].classList.add('active');dts[cur].classList.remove('done');dts[cur].classList.add('current');
  document.getElementById('counter').textContent=(cur+1)+' / '+S.length;
  document.getElementById('prevBtn').disabled=cur===0;
  document.getElementById('nextBtn').disabled=cur===S.length-1;
}
function go(d){if(cur+d>=0&&cur+d<S.length)goTo(cur+d);}
goTo(0);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1);});
</script>
